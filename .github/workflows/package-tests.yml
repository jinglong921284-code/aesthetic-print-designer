name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install program test dependencies
        run: python -m pip install -r skills/aesthetic-print-designer/requirements-visual.txt 'pypdf>=6,<7'
      - name: Build and test portable package
        run: python .github/scripts/validate_package.py
