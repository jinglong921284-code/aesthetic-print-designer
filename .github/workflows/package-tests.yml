name: Package tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install program test dependencies
        run: python -m pip install -r skills/aesthetic-print-designer/requirements-visual.txt 'pypdf>=6,<7'
      - name: Build and test portable package
        run: python .github/scripts/validate_package.py
